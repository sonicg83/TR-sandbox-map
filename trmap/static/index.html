<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>TRMap · 战略沙盘</title><link rel="stylesheet" href="/static/styles.css?v=2"></head><body>
<header><strong>TR<span>MAP</span></strong><small>本地战略沙盘 · 初版</small><select id="worlds" aria-label="服务器"></select><button id="newWorld">＋ 新建服务器</button><div class="spacer"></div><span class="local">● 本地模式</span></header>
<main><aside><div class="heading"><b>地图数据</b><span>01</span></div><p>数据保存在本机，时间未知的观察会明确标注。</p><label>数据类型<select id="kind"><option value="map_sql">每日地图 map.sql</option><option value="scan_json">扫描结果 JSON</option></select></label><label>选择文件<input type="file" id="file"></label><label>观察时间（可选）<input type="datetime-local" id="observed"></label><button id="import" class="primary">导入数据</button><p id="importStatus" class="hint">选择文件时请确认其属于当前服务器。</p><hr><div class="heading"><b>定位与筛选</b><span>02</span></div><div class="row"><input id="x" type="number" placeholder="X"><input id="y" type="number" placeholder="Y"><button id="go">前往</button></div><label>联盟筛选<input id="filter" placeholder="输入联盟名称"></label><label>地块类型<select id="tileFilter"><option value="all">全部</option><option value="village">村庄</option><option value="available">可用地块</option><option value="oasis">绿洲</option><option value="landscape">地貌</option></select></label><label>搜索村庄 / 玩家 / 联盟<input id="search" placeholder="输入名称并回车"></label><div id="results"></div><hr><div class="heading"><b>我的方案</b><span>03</span></div><select id="plans" aria-label="方案"></select><button id="newPlan">＋ 新建方案</button><div class="row"><button id="mark">标记当前地块</button><button id="arrow">绘制路线</button></div><p class="hint">路线：选中起点后点击终点。可在下方列表编辑和删除。</p><div id="items"></div><p id="planStatus" class="hint"></p></aside>
<section class="stage"><div class="toolbar"><div><b id="worldName">选择或创建服务器</b><small>拖动地图 · 滚轮缩放 · 点击地块查看详情（10% 仅显示村庄及相关冲突）</small></div><div id="zoom">100%</div></div><canvas id="map"></canvas><div class="map-controls" role="group" aria-label="地图缩放工具"><button id="zoomIn" type="button" aria-label="放大" title="放大" disabled>+</button><button id="zoomOut" type="button" aria-label="缩小" title="缩小">−</button><button id="centerOrigin" type="button" aria-label="回到原点" title="回到原点">⌖</button></div><div class="legend"><span>● 村庄</span><span>绿环：未占领绿洲</span><span>红环：已占领绿洲</span><span>浅绿：空地</span><span>□ 未知</span></div><div class="watermark">TRMAP <span>／</span> SANDBOX</div></section><aside class="details"><div class="heading"><b>地块情报</b><span>04</span></div><p id="coord" class="coord">— / —</p><div id="detail" class="detail">选择地图上的地块以查看已导入的信息。</div><div class="notice"><b>观察说明</b><p>地块颜色为自绘示意。未扫描不等于空地；观察时间与导入时间分别显示。</p></div></aside></main><div id="toast" role="status"></div><script type="module" src="/static/app.mjs?v=8"></script></body></html>
